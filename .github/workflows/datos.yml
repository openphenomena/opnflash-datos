# Actualiza los datos de opnflash.com cada hora (minuto 17) y al pedirlo a mano.
# Los datos se publican con GitHub Pages desde este repositorio público (https://openphenomena.github.io/opnflash-datos/datos/),
# así que actualizar datos ya no gasta publicaciones de Cloudflare Pages en el sitio.
name: Actualizar datos
on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: datos
  cancel-in-progress: false
jobs:
  datos:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install sgp4
      - name: Datos del mapa (portada.json)
        id: datos
        shell: bash
        run: set -o pipefail; python3 herramientas/datos.py . 2>&1 | tee datos.log
        continue-on-error: true
      - name: Titulares de medios (titulares.json)
        id: medios
        shell: bash
        run: set -o pipefail; python3 herramientas/medios.py . 150 2>&1 | tee medios.log
        continue-on-error: true
      - name: Modelos del traductor libre (se guardan entre ejecuciones)
        uses: actions/cache@v4
        with:
          path: |
            ~/.local/share/argos-translate
            ~/.local/cache/argos-translate
          key: argos-v1-${{ github.run_id }}
          restore-keys: argos-v1-
      - name: Traducción de titulares al español y al inglés (traductor libre, sin coste)
        id: traducir
        continue-on-error: true
        timeout-minutes: 12
        run: |
          set -o pipefail
          pip install -q ctranslate2 sentencepiece subword-nmt sacremoses 2>&1 | tail -1
          python3 herramientas/traducir.py . 240 200 2>&1 | tee traducir.log
      - name: Partir titulares por idioma (titulares-es.json y titulares-en.json)
        id: partir
        if: always()
        continue-on-error: true
        run: python3 herramientas/partir.py .
      - name: Capas del modo Experto (capas.json)
        id: capas
        continue-on-error: true
        run: set -o pipefail; python3 herramientas/capas.py . 2>&1 | tee capas.log
      - name: Señales de vídeo en directo (directos.json)
        id: directos
        shell: bash
        run: set -o pipefail; python3 herramientas/directos.py . 2>&1 | tee directos.log
        continue-on-error: true
      # Aviso claro en vez de reintentos: cada ejecución deja un resumen con las fuentes que fallaron.
      # No marca la ejecución como fallida por una fuente caída, para no mandar correos de error cada hora.
      - name: Resumen de avisos
        if: always()
        run: |
          {
            echo "## Datos de opnflash.com"
            echo "- portada.json: ${{ steps.datos.outcome }} · titulares.json: ${{ steps.medios.outcome }} · directos.json: ${{ steps.directos.outcome }} · capas.json: ${{ steps.capas.outcome }} · traducción: ${{ steps.traducir.outcome }}"
            grep -h "traducidos ahora" traducir.log 2>/dev/null | sed 's/^/- /'
            n=$(grep -h "^AVISO" datos.log medios.log directos.log capas.log traducir.log 2>/dev/null | wc -l)
            echo "- Fuentes con aviso: $n"
            grep -h "^AVISO" datos.log directos.log capas.log 2>/dev/null | head -30 | sed 's/^/    /'
            grep -h "sin directo\|no insertable" directos.log 2>/dev/null | head -12 | sed 's/^/    /'
          } >> "$GITHUB_STEP_SUMMARY"
          rm -f datos.log medios.log directos.log capas.log traducir.log
      # Si mientras tanto otra ejecución (programada o lanzada a mano) ya subió datos, no se hace rebase
      # (los JSON chocan siempre): se parte de lo último de main, se ponen encima los datos recién
      # generados y se suman las traducciones de los dos lados. Hasta 5 intentos.
      - name: Guardar si hay cambios
        run: |
          git config user.name "opnflash-datos"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          NUEVOS="$RUNNER_TEMP/datos-nuevos"
          rm -rf "$NUEVOS"; cp -r datos "$NUEVOS"
          for intento in 1 2 3 4 5; do
            git fetch -q origin main
            git reset -q --hard origin/main
            cp "$NUEVOS"/*.json datos/
            python3 - "$NUEVOS/traducciones.json" <<'PY'
          import json, sys
          try:
              nuevo = json.load(open(sys.argv[1], encoding='utf-8'))
              remoto = json.loads(__import__('subprocess').check_output(['git', 'show', 'origin/main:datos/traducciones.json']))
              t = dict(remoto.get('t', {})); t.update(nuevo.get('t', {})); nuevo['t'] = t
              n = dict(remoto.get('n', {})); n.update(nuevo.get('n', {})); nuevo['n'] = n
              json.dump(nuevo, open('datos/traducciones.json', 'w', encoding='utf-8'), ensure_ascii=False, separators=(',', ':'))
          except Exception as e:
              print('AVISO: no se pudieron sumar las traducciones:', e)
          PY
            git add datos
            if git diff --cached --quiet; then echo "Sin cambios"; exit 0; fi
            git commit -q -m "Datos: actualización automática $(date -u +'%Y-%m-%d %H:%M UTC')"
            if git push -q origin HEAD:main; then echo "Guardado (intento $intento)"; exit 0; fi
            echo "main cambió mientras se guardaba; se reintenta"; sleep $((intento * 15))
          done
          echo "No se pudo guardar tras 5 intentos"; exit 1
